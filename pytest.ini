[pytest]
testpaths = tests
addopts = --strict-markers --cov=app --cov=config --cov=controllers --cov=models --cov=services --cov=utils --cov=middleware --cov=routes --cov=realtime --cov=ai --cov-report=term-missing
asyncio_mode = auto
markers =
    unit: fast tests for pure functions and isolated helpers
    api: Flask route and controller tests
    slow: longer-running tests that can be skipped in local runs
    agent: tests for AI assistant routing and workflow behavior
    ui: end-to-end frontend journey tests
