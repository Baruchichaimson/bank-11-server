services:
  bank-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank-backend
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/bank-11
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: bank-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:
