services:
  backend:
    build:
      context: .
    image: bank-backend-flask
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      MONGO_URI: mongodb://mongo:27017/bank-11
      JWT_SECRET: ${JWT_SECRET:-docker-dev-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      SOCKET_CORS_ORIGINS: ${SOCKET_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_FALLBACK_MODEL: ${OPENAI_FALLBACK_MODEL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GROQ_FALLBACK_MODEL: ${GROQ_FALLBACK_MODEL:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Bank One One}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_CAPTURE_IO: ${LANGFUSE_CAPTURE_IO:-false}
      ASSISTANT_TRACE_LOGS: ${ASSISTANT_TRACE_LOGS:-false}
      ASSISTANT_DEBUG_ERRORS: ${ASSISTANT_DEBUG_ERRORS:-false}
      SOCKET_DEBUG: ${SOCKET_DEBUG:-false}
      BANKING_GRAPH_DEBUG: ${BANKING_GRAPH_DEBUG:-false}
      PENDING_REGISTRATION_CLEANUP_INTERVAL_MS: ${PENDING_REGISTRATION_CLEANUP_INTERVAL_MS:-3600000}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_SIGNED_URL_MINUTES: ${GCS_SIGNED_URL_MINUTES:-5}
      GCS_SIGNING_SERVICE_ACCOUNT_EMAIL: ${GCS_SIGNING_SERVICE_ACCOUNT_EMAIL:-}
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
